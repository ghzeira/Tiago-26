<h2>Desafio Final - Matrícula em Curso</h2>

<label>Nome do aluno:</label>

<input
  type="text"
  [(ngModel)]="nomeAluno"
  placeholder="Digite seu nome"
>

<p>Aluno: {{ nomeAluno }}</p>

<p>
  Quantidade de disciplinas: {{ quantidadeDisciplinas }}
</p>

<button
  (click)="diminuirDisciplinas()"
  [disabled]="quantidadeDisciplinas === 1"
>
  -
</button>

<button
  (click)="aumentarDisciplinas()"
>
  +
</button>

<br><br>

<button
  [disabled]="nomeAluno.trim() === ''"
  (click)="realizarMatricula()"
>
  Realizar Matrícula
</button>

<p>{{ mensagem }}</p>
